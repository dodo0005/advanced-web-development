<!DOCTYPE html>
<html>
<head>
    <title>Book Library</title>
</head>
<body>
    <h1>Books</h1>
    <div id="books"></div>

    <script>
        async function loadBooks() {
            const response = await fetch("https://advanced-web-development.onrender.com/books", {
                headers: {
                    "X-API-Key": "mmmksnasserwebdev"
                }
            });

            const data = await response.json();
            document.getElementById("books").innerText = JSON.stringify(data, null, 2);
        }

        loadBooks();
    </script>
</body>
</html>
